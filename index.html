<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Offline PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4285F4">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background-color: #3367D6; }
    
    /* Dedicated Styling for our New Install Button */
    #installAppBtn {
      background-color: #34A853; /* Google Green */
      font-weight: bold;
      display: none; /* Hidden by default until Chrome says it's ready */
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    #installAppBtn:hover { background-color: #2b8c46; }

    #statusMessage {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
    .db-status { color: #555; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

  <button id="installAppBtn">📲 Install App to Homescreen</button>

  <div class="card">
    <h2>Fast Notes PWA</h2>
    <p>Local IndexedDB Storage + GAS Backend</p>
    
    <input type="text" id="noteInput" placeholder="Type a note here...">
    <button onclick="saveNoteLocally()">Save to Local Storage</button>
    
    <div id="statusMessage">App Ready.</div>
    <div class="db-status" id="dbStatus">Initializing database...</div>
  </div>

  <script>
    // ==========================================
    // 1. PWA INSTALLATION LOGIC (The Magic Fix)
    // ==========================================
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    // Chrome fires this event when the app is eligible to be installed
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log("Install prompt triggered by Chrome!");
      // Prevent the default mini-infobar from appearing
      e.preventDefault();
      // Stash the event so we can trigger it when the user clicks our button
      deferredPrompt = e;
      // Make our giant green button visible!
      installBtn.style.display = 'block';
    });

    // When the user clicks our green button...
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Show Chrome's native installation prompt
        deferredPrompt.prompt();
        // Wait for the user to respond to the prompt
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        // We can't use the prompt again, so discard it
        deferredPrompt = null;
        // Hide the button since they installed it
        installBtn.style.display = 'none';
      }
    });

    // Listen to see if they successfully installed it
    window.addEventListener('appinstalled', () => {
      console.log('Success! PWA was installed to the device.');
      installBtn.style.display = 'none';
    });

    // ==========================================
    // 2. REGISTER SERVICE WORKER
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.error('Service Worker failed!', err));
      });
    }

    // ==========================================
    // 3. INDEXED-DB LOGIC
    // ==========================================
    let db;
    const request = indexedDB.open("GasAppDatabase", 1);

    request.onupgradeneeded = function(event) {
      db = event.target.result;
      if (!db.objectStoreNames.contains("notes")) {
        db.createObjectStore("notes", { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      document.getElementById('dbStatus').innerText = "IndexedDB: Connected & Fast";
    };

    request.onerror = function(event) {
      document.getElementById('dbStatus').innerText = "IndexedDB: Error loading.";
    };

    function saveNoteLocally() {
      const input = document.getElementById('noteInput');
      const status = document.getElementById('statusMessage');
      const noteText = input.value.trim();

      if (noteText === "") {
        status.innerText = "Please type something first!";
        status.style.color = "red";
        return;
      }

      // Save to IndexedDB instantly
      const transaction = db.transaction(["notes"], "readwrite");
      const store = transaction.objectStore("notes");
      const addRequest = store.add({ text: noteText, timestamp: new Date().getTime() });

      addRequest.onsuccess = function() {
        input.value = ""; 
        status.innerText = "Saved to IndexedDB instantly!";
        status.style.color = "green";
      };
    }
  </script>
</body>
</html>
